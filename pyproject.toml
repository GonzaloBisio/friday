[project]
name = "friday"
version = "0.1.0"
description = "FRIDAY — Asistente personal con cerebro Gemini"
# 3.12 recomendado: vosk/pyaudio/ctranslate2 no siempre tienen wheels para 3.13+.
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # API + scheduler
    "fastapi>=0.137",
    "uvicorn>=0.49",
    "websockets>=15",
    "python-multipart>=0.0.32",
    "apscheduler>=3.11",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    # Cerebro Gemini
    "google-genai>=2.8",
    # Observabilidad / sistema
    "psutil>=7.0",
    "boto3>=1.34",
    # Integraciones + research web
    "httpx>=0.27",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "numpy>=2.0",
    "gspread>=6.0",
    # Dashboard Streamlit legacy (el HUD nuevo es HTML puro, sin build)
    "streamlit>=1.58",
    "streamlit-autorefresh>=1.0",
]

[project.optional-dependencies]
# Emisor IR Broadlink RM4 Mini (control de luces LED + TV/aire por infrarrojo).
# Opcional: con ir_backend="mock" (default) no hace falta. Instalar: pip install -e ".[ir]"
ir = ["broadlink>=0.18"]
# Listener de voz (friday/voice/wake.py). En macOS corre en el mismo venv que el
# backend. Requiere portaudio del sistema (brew install portaudio). Python 3.12.
voice = [
    "vosk>=0.3.44",
    "pyaudio",
    "piper-tts",
    "faster-whisper",
    "pocket-tts",
    "websocket-client",
    "numpy>=2.0",
    # STT en la GPU de Apple Silicon (Metal). Solo macOS arm64.
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # STT default en Apple Silicon: 0.14s por frase (7x más rápido que whisper-turbo).
    "parakeet-mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
friday = "friday.app:main"
friday-spotify-auth = "friday.integrations.spotify_auth:main"
friday-ir-learn = "friday.integrations.ir.learn:main"
friday-wake = "friday.voice.wake:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
