[project]
name = "friday"
version = "0.1.0"
description = "FRIDAY — Asistente personal con cerebro Gemini"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
friday = "friday.app:main"
friday-wake = "friday.voice.wake:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
