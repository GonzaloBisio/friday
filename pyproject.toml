[project]
name = "friday"
version = "0.1.0"
description = "FRIDAY — Asistente personal con cerebro Gemini"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # API + scheduler (backend WSL)
    "fastapi>=0.137",
    "uvicorn>=0.49",
    "websockets>=15",
    "python-multipart>=0.0.32",
    "apscheduler>=3.11",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    # Cerebro Gemini
    "google-genai>=2.8",
    # Observabilidad / sistema
    "psutil>=7.0",
    "boto3>=1.34",
    # Integraciones + research web
    "httpx>=0.27",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "numpy>=2.0",
    "gspread>=6.0",
    # Dashboard Streamlit legacy (el HUD nuevo es HTML puro, sin build)
    "streamlit>=1.58",
    "streamlit-autorefresh>=1.0",
]

[project.optional-dependencies]
# Emisor IR Broadlink RM4 Mini (control de luces LED + TV/aire por infrarrojo).
# Opcional: con ir_backend="mock" (default) no hace falta. Instalar: pip install -e ".[ir]"
ir = ["broadlink>=0.18"]

[project.scripts]
friday = "friday.app:main"
friday-spotify-auth = "friday.integrations.spotify_auth:main"
friday-ir-learn = "friday.integrations.ir.learn:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
